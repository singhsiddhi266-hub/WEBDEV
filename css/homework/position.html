<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.body{
    background-image: url("bg.jpeg");
    background-size: cover;
    height:100vh;
    width:100vw;
}
.name {
    position: fixed;
    color: white;
    font-size: 30px;
    font-weight: bold;
}
.top-left {
    top: 10px;
    left: 10px;
}

.top-center {
    top: 10px;
    left: 50%;
}

.top-right {
    top: 10px;
    right: 10px;
}


.center-left {
    top: 50%;
    left: 10px;
}

.center {
    top: 50%;
    left: 50%;
}

.center-right {
    top: 50%;
    right: 10px;
}


.bottom-left {
    bottom: 10px;
    left: 10px;
}

.bottom-center {
    bottom: 10px;
    left: 50%;
}

.bottom-right {
    bottom: 10px;
    right: 10px;
}
</style>
<body>
    <div class="body">
    </div>
    <div class="name top-left">SIDDHI</div>
    <div class="name top-center">SIDDHI</div>
    <div class="name top-right">SIDDHI</div>
    <div class="name center-left">SIDDHI</div>
    <div class="name center">SIDDHI</div>
    <div class="name center-right">SIDDHI</div>
    <div class="name bottom-left">SIDDHI</div>
    <div class="name bottom-center">SIDDHI</div>
    <div class="name bottom-right">SIDDHI</div>
</body>
</html>
