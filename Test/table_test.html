<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="3" cellpadding="10", cellspacing="5" width="80%" align="center">
        <caption><b>Quarterly Sales Report(INR)</b></caption>
        <thead>
            <tr bgcolor="gray">
                <th>Category</th>
                <th >Product</th>
                <th >Q1 Sales</th>
                <th>Q2 Sales</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2" valign="top" bgcolor="white">
                    Electronics
                </td>
                <td align="left">Smartphones</td>
                <td align="right">₹4,72,450</td>
                <td align="right">₹5,85,838</td>
            </tr>
            <tr>
                <td align="left">Laptops</td>
                <td align="right">₹8,03,165</td>
                <td align="right">₹8,59,859</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td bgcolor="lightgray" colspan="2">
                    <b>Total Gross</b>
                </td>
                <td bgcolor="lightgray"><b>₹12,75,615</b></td>
                <td bgcolor="lightgray"><b>₹14,45,697</b></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
